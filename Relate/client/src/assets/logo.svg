<svg xmlns="http://www.w3.org/2000/svg" width="45" height="54" viewBox="0 0 45 59">
  <defs>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="1.8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- transparent background -->
  <g stroke="#8b9700" stroke-width="1.15" stroke-linecap="round" opacity="0.8">
    <line x1="15.1" y1="13.6" x2="8.6" y2="21.9"/>
    <line x1="15.1" y1="13.6" x2="21.7" y2="23.1"/>
    <line x1="8.6" y1="21.9" x2="14.1" y2="29.6"/>
    <line x1="14.1" y1="29.6" x2="21.7" y2="23.1"/>
    <line x1="21.7" y1="23.1" x2="32.9" y2="16.2"/>
    <line x1="21.7" y1="23.1" x2="29.1" y2="28.9"/>
    <line x1="29.1" y1="28.9" x2="21.6" y2="38.3"/>
    <line x1="21.6" y1="38.3" x2="14.1" y2="29.6"/>
    <line x1="32.9" y1="16.2" x2="29.1" y2="28.9"/>
  </g>

  <g fill="#dfff00" filter="url(#glow)">
    <circle cx="15.1" cy="13.6" r="4.25"/>
    <circle cx="32.9" cy="16.2" r="5.35"/>
    <circle cx="8.6" cy="21.9" r="3.0"/>
    <circle cx="21.7" cy="23.1" r="3.0"/>
    <circle cx="29.1" cy="28.9" r="2.35"/>
    <circle cx="14.1" cy="29.6" r="1.95"/>
    <circle cx="21.6" cy="38.3" r="4.0"/>
  </g>
</svg>
